<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Data Analysis Assistant</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2e;
      --muted: #8aa0bf;
      --text: #e6eefc;
      --accent: #5aa9ff;
      --accent-2: #8ef6d0;
      --danger: #ff6b6b;
      --ok: #27d07d;
      --border: #24314e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(1100px 600px at 10% -10%, rgba(90,169,255,0.18), transparent 55%),
                  radial-gradient(900px 500px at 110% 10%, rgba(142,246,208,0.12), transparent 55%),
                  var(--bg);
      min-height: 100vh;
    }
    header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(18,26,46,0.7);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.2px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .badge {
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 11px;
      color: var(--muted);
    }
    .container {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 16px;
      padding: 16px;
    }
    @media (max-width: 980px) {
      .container { grid-template-columns: 1fr; }
    }
    .panel {
      background: linear-gradient(180deg, rgba(18,26,46,0.75), rgba(12,18,33,0.75));
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .panel h3 {
      margin: 0;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      color: var(--muted);
      background: rgba(12,18,33,0.45);
    }
    .panel-content { padding: 14px; }
    .settings-grid {
      display: grid;
      gap: 10px;
    }
    label { font-size: 13px; color: var(--muted); }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0f1629;
      color: var(--text);
      outline: none;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: #101a30;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { background: #12203b; }
    .btn.accent { border-color: #2b63a3; background: #0e284b; color: #cfe6ff; }
    .btn.ok { border-color: #2c7a58; background: #0d2e25; color: #c7f4e2; }
    .btn.danger { border-color: #7a2c2c; background: #2e0d0d; color: #ffd7d7; }
    .status {
      font-size: 12px;
      color: var(--muted);
      padding-left: 6px;
    }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--danger); }
    .chat {
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: calc(100vh - 190px);
    }
    #messages {
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 90%;
      line-height: 1.35;
      white-space: pre-wrap;
      background: #0f172a;
    }
    .msg.user { align-self: flex-end; background: #0d223f; border-color: #284a76; }
    .msg.assistant { align-self: flex-start; background: #0f1629; border-color: #2a3451; }
    .composer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: rgba(12,18,33,0.45);
    }
    .composer input[type="text"] {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f1629;
      color: var(--text);
    }
    .sidebar .drop {
      border: 1px dashed #2a3a5d;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      color: var(--muted);
    }
    .file-list {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      background: rgba(12,18,33,0.45);
    }
    a.inline { color: var(--accent); text-decoration: none; }
    a.inline:hover { text-decoration: underline; }
    code.tag {
      padding: 2px 6px;
      border-radius: 6px;
      background: #0e1b33;
      border: 1px solid #24314e;
      color: #b7c8e6;
    }
  </style>
</head>
<body>
  <header>
    <h1>🧠 Data Analysis Assistant <span class="badge">Client</span></h1>
  </header>

  <div class="container">
    <aside class="panel">
      <h3>Settings</h3>
      <div class="panel-content settings-grid">
        <div>
          <label for="apiBase">API base URL</label>
          <input id="apiBase" type="text" placeholder="http://127.0.0.1:8000" />
        </div>
        <div class="row">
          <label for="useWs">Use WebSocket</label>
          <input id="useWs" type="checkbox" />
          <input id="wsPath" type="text" placeholder="/ws" style="max-width:160px" />
          <input id="restPath" type="text" placeholder="/analyze" style="max-width:160px" />
        </div>
        <div class="row">
          <button id="saveSettings" class="btn accent">Save</button>
          <button id="testConn" class="btn ok">Connect</button>
          <a id="openApi" class="btn" target="_blank" rel="noopener">Open Backend</a>
          <span id="connStatus" class="status">Not connected</span>
        </div>
      </div>
    </aside>

    <section class="panel">
      <h3>Assistant</h3>
      <div class="panel-content chat">
        <div id="messages"></div>
        <div class="composer">
          <input id="prompt" type="text" placeholder="Ask a question about your data..." />
          <div class="row">
            <button id="sendBtn" class="btn accent">Send</button>
            <label class="btn">
              <input id="fileInput" type="file" accept=".csv,.json,.xlsx" style="display:none" />
              Upload
            </label>
          </div>
        </div>
      </div>
    </section>

    <aside class="panel sidebar">
      <h3>Files</h3>
      <div class="panel-content">
        <div id="drop" class="drop">Drop files here or use Upload</div>
        <div id="fileList" class="file-list"></div>
      </div>
    </aside>
  </div>

  <footer>
    Tip: Expose a health check at <code class="tag">/health</code> and enable CORS on the Python server so the browser can call it [Settings → Connect] [web:19].
  </footer>

  <script>
    // Persistent config
    const els = {
      apiBase: document.getElementById('apiBase'),
      useWs: document.getElementById('useWs'),
      wsPath: document.getElementById('wsPath'),
      restPath: document.getElementById('restPath'),
      save: document.getElementById('saveSettings'),
      test: document.getElementById('testConn'),
      open: document.getElementById('openApi'),
      status: document.getElementById('connStatus'),
      messages: document.getElementById('messages'),
      prompt: document.getElementById('prompt'),
      send: document.getElementById('sendBtn'),
      input: document.getElementById('fileInput'),
      drop: document.getElementById('drop'),
      list: document.getElementById('fileList'),
    };

    const cfg = {
      apiBase: localStorage.getItem('daa_apiBase') || 'http://127.0.0.1:8000',
      useWs: localStorage.getItem('daa_useWs') === 'true',
      wsPath: localStorage.getItem('daa_wsPath') || '/ws',
      restPath: localStorage.getItem('daa_restPath') || '/analyze',
      uploadPath: '/upload',
      healthPath: '/health',
      docsPath: '/docs'
    };

    let sessionId = localStorage.getItem('daa_sessionId') || crypto.randomUUID();
    localStorage.setItem('daa_sessionId', sessionId);

    // State
    let ws = null;
    let wsReady = false;

    // Init UI
    function syncUI() {
      els.apiBase.value = cfg.apiBase;
      els.useWs.checked = cfg.useWs;
      els.wsPath.value = cfg.wsPath;
      els.restPath.value = cfg.restPath;
      els.open.href = cfg.apiBase.replace(/\/$/, '') + cfg.docsPath;
    }
    syncUI();

    function saveCfg() {
      cfg.apiBase = els.apiBase.value.trim().replace(/\/$/, '');
      cfg.useWs = !!els.useWs.checked;
      cfg.wsPath = els.wsPath.value.trim() || '/ws';
      cfg.restPath = els.restPath.value.trim() || '/analyze';

      localStorage.setItem('daa_apiBase', cfg.apiBase);
      localStorage.setItem('daa_useWs', String(cfg.useWs));
      localStorage.setItem('daa_wsPath', cfg.wsPath);
      localStorage.setItem('daa_restPath', cfg.restPath);
      syncUI();
      setStatus('Saved', true);
    }

    function setStatus(text, ok = null) {
      els.status.textContent = text;
      els.status.classList.remove('ok', 'bad');
      if (ok === true) els.status.classList.add('ok');
      if (ok === false) els.status.classList.add('bad');
    }

    function appendMsg(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');
      div.textContent = text;
      els.messages.appendChild(div);
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    // REST call via Fetch
    async function sendREST(message) {
      const url = cfg.apiBase + cfg.restPath;
      const body = { message, session_id: sessionId };
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        mode: 'cors',
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      return data.reply ?? JSON.stringify(data);
    }

    // WebSocket mode
    function httpToWs(url) {
      return url.replace(/^http:/, 'ws:').replace(/^https:/, 'wss:');
    }
    function ensureWs() {
      return new Promise((resolve, reject) => {
        if (ws && wsReady) return resolve(ws);
        try {
          ws = new WebSocket(httpToWs(cfg.apiBase) + cfg.wsPath);
        } catch (e) {
          return reject(e);
        }
        ws.onopen = () => { wsReady = true; resolve(ws); };
        ws.onclose = () => { wsReady = false; };
        ws.onerror = (e) => { wsReady = false; console.error(e); };
        ws.onmessage = (ev) => {
          // Expect server to send plain text or JSON with {type, data}
          try {
            const obj = JSON.parse(ev.data);
            const content = obj.data ?? obj.reply ?? ev.data;
            appendMsg('assistant', String(content));
          } catch {
            appendMsg('assistant', ev.data);
          }
        };
      });
    }

    async function sendWS(message) {
      const socket = await ensureWs();
      const payload = JSON.stringify({ type: 'message', message, session_id: sessionId });
      socket.send(payload);
      // Server should stream responses via onmessage handler
      return '…streaming…';
    }

    async function onSend() {
      const text = els.prompt.value.trim();
      if (!text) return;
      appendMsg('user', text);
      els.prompt.value = '';
      try {
        if (cfg.useWs) {
          await sendWS(text);
        } else {
          const reply = await sendREST(text);
          appendMsg('assistant', reply);
        }
      } catch (err) {
        appendMsg('assistant', 'Error: ' + (err?.message || err));
      }
    }

    async function onUpload(file) {
      const url = cfg.apiBase + cfg.uploadPath;
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await fetch(url, { method: 'POST', body: fd, mode: 'cors' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        appendMsg('assistant', 'Uploaded: ' + (data.filename || file.name));
        renderFiles(file.name);
      } catch (e) {
        appendMsg('assistant', 'Upload failed: ' + (e?.message || e));
      }
    }

    function renderFiles(name) {
      const item = document.createElement('div');
      item.textContent = '• ' + name;
      els.list.appendChild(item);
    }

    async function testConnection() {
      setStatus('Connecting…');
      const healthUrl = cfg.apiBase + cfg.healthPath;
      try {
        const res = await fetch(healthUrl, { method: 'GET', mode: 'cors' });
        if (res.ok) {
          setStatus('Connected', true);
        } else {
          setStatus('Unhealthy: ' + res.status, false);
        }
      } catch {
        setStatus('No response', false);
      }
      els.open.href = cfg.apiBase + cfg.docsPath;
    }

    // Events
    els.save.addEventListener('click', saveCfg);
    els.test.addEventListener('click', testConnection);
    els.send.addEventListener('click', onSend);
    els.prompt.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        onSend();
      }
    });

    els.input.addEventListener('change', (e) => {
      const f = e.target.files?.[0];
      if (f) onUpload(f);
      e.target.value = '';
    });

    // Drag & drop
    ;['dragenter','dragover'].forEach(ev =>
      els.drop.addEventListener(ev, (e) => { e.preventDefault(); els.drop.style.borderColor = '#3e6aae'; })
    );
    ;['dragleave','drop'].forEach(ev =>
      els.drop.addEventListener(ev, (e) => { e.preventDefault(); els.drop.style.borderColor = '#2a3a5d'; })
    );
    els.drop.addEventListener('drop', (e) => {
      const f = e.dataTransfer.files?.[0];
      if (f) onUpload(f);
    });

    // Keep Open Backend link fresh
    const observer = new MutationObserver(() => {
      els.open.href = cfg.apiBase + cfg.docsPath;
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
